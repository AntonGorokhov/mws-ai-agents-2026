[project]
name = "kaggle-ml-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "catboost>=1.2",
    "lightgbm>=4.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.scripts]
kaggle-agents = "src.main:main"
